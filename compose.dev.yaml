# Development overlay: build both images from this checkout and run them, instead of pulling from
# docker.io. For working from a clone (e.g. Docker Desktop on the M3):
#   git pull && make dev          # = docker compose -f compose.yaml -f compose.dev.yaml up -d --build
#   make dev-down
# The database runs without the pgdata volume, so each rebuild serves the data baked into the new
# image. With the volume, Docker seeds it from the image only once, and a pull would keep showing the
# old data.
services:
  atlas:
    image: localhost/ionis-ai-atlas:dev
    build: { context: ., dockerfile: Containerfile }
    pull_policy: build
  db:
    image: localhost/ionis-ai-atlas-db:dev
    build: { context: db, dockerfile: Containerfile }
    pull_policy: build
    volumes: !reset []
