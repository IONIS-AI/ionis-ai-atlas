# IONIS-AI Atlas. `docker compose up`, then open http://localhost:8080
# The two containers together are held to the target machine's budget: 4 CPUs and 8 GB
# Images are full references so the dev channel can use one repository with the kind in the tag.
# There is no public release yet ("unreleased"); a release pins exact versions here. To run from a
# clone today, use `make dev`.
# (Atlas SPEC.md, "Target machine"). The database port is not published outside this network.
name: ionis-ai-atlas
services:
  atlas:
    image: ${ATLAS_APP_IMAGE:-docker.io/ki7mt/ionis-ai-atlas:unreleased}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ATLAS_DB_URL: postgresql://atlas_ro:atlas@db:5432/ionis
    depends_on:
      db: { condition: service_healthy }
    cpus: 1
    mem_limit: 1g
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  db:
    image: ${ATLAS_DB_IMAGE:-docker.io/ki7mt/ionis-ai-atlas-db:unreleased}
    cpus: 3
    mem_limit: 7g
    shm_size: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [pgdata:/var/lib/pgsql/17/data]
volumes:
  pgdata:
