# IONIS-AI Atlas. `docker compose up`, then open http://localhost:8080
# The two containers together are held to the target machine's budget: 4 CPUs and 8 GB (Atlas
# SPEC.md, "Target machine"). The database port is not published outside this network.
# Pinned to a public release; no login is needed to pull. Images are full references so the dev
# channel (one private repository, kind in the tag) can override them.
# Healthchecks live here, not only in the images: the published images are OCI format (needed for
# their SBOM and provenance), and podman ignores HEALTHCHECK in OCI images. Here, every engine runs them.
name: ionis-ai-atlas
services:
  atlas:
    image: ${ATLAS_APP_IMAGE:-docker.io/ki7mt/ionis-ai-atlas:0.1.0}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ATLAS_DB_URL: postgresql://atlas_ro:atlas@db:5432/ionis
    depends_on:
      db: { condition: service_healthy }
    cpus: 1
    mem_limit: 1g
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health',timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
  db:
    image: ${ATLAS_DB_IMAGE:-docker.io/ki7mt/ionis-ai-atlas-db:0.1.0}
    cpus: 3
    mem_limit: 7g
    shm_size: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [pgdata:/var/lib/pgsql/17/data]
    healthcheck:
      # Fails while the entrypoint reconciles on the local socket only, so Atlas starts after it.
      test: ["CMD-SHELL", "pg_isready -d ionis -U atlas_ro -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s   # a first start on an empty volume loads ADIF before it can answer
volumes:
  pgdata:
